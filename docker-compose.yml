version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: siem_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: siem_db
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: siem_backend
    ports:
      - "8000:8000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=siem_db
      - SECRET_KEY=siem_super_secret_jwt_key_2026_change_in_prod
    depends_on:
      db:
        condition: service_healthy
    restart: always

  collector:
    build:
      context: ./collector
    container_name: siem_collector
    ports:
      - "514:514/udp"
    environment:
      - INGEST_URL=http://backend:8000/api/v1/logs/ingest
      - HOST_NAME=siem-collector-01
    depends_on:
      - backend
    restart: always

  dashboard:
    build:
      context: ./dashboard
    container_name: siem_dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
